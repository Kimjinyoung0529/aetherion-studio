name: AETHERION Kernel Tournament
on:
  push:
    paths:
      - 'runtime/experiments/**'
      - 'tools/run_gpu_experiments.cjs'
      - '.github/workflows/kernel-tournament.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-kernel-designs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent strategy generators and CPU reference logic
        run: node runtime/experiments/test_strategies.mjs
      - name: Check source syntax
        run: |
          node --check runtime/experiments/kernel-strategies.js
          node --check runtime/experiments/kernel-race.js
          node --check tools/run_gpu_experiments.cjs
  chrome-webgpu-benchmark:
    needs: independent-kernel-designs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium and Playwright
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chromium is unavailable, no GPU speed claims allowed'
            exit 1
          fi
          echo "BROWSER_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          echo "PW_CORE_DIR=$RUNNER_TEMP/aetherion-bench/node_modules/playwright-core" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/aetherion-bench" --no-save --ignore-scripts playwright-core@1.56.1
      - name: Execute five real WGSL implementations on Chrome SwiftShader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aetherion-race-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          sleep 2
          node tools/run_gpu_experiments.cjs
      - name: Upload full matrix accuracy and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-swiftshader-kernel-race
          path: kernel-race-results.json
          retention-days: 14
          if-no-files-found: warn
