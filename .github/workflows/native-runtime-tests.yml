name: AETHERION Universal Runtime Tests
on:
  push:
    paths:
      - 'runtime/**'
      - '.github/workflows/native-runtime-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime tuning and mocked backend compatibility
        run: node runtime/test_runtime.mjs
      - name: Verify first-party packed WGSL benchmark fixtures
        run: node runtime/test_native.mjs
      - name: Test v2 multi-kernel autotune correctness gating
        run: node runtime/test_autotune.mjs
      - name: Simulate GPU buffer reuse and corrupted-kernel fallback
        run: node runtime/test_session.mjs
      - name: Validate browser JavaScript syntax
        run: |
          node --check runtime/tuner.js
          node --check runtime/engine.js
          node --check runtime/app.js
          node --check runtime/native-kernel.js
          node --check runtime/autotune-v2.js
          node --check runtime/autotune-ui.js
          node --check runtime/native-session.js
