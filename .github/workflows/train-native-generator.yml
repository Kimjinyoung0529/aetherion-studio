name: Train AETHERION Native Generator
on:
  push:
    paths:
      - "lab/train_generator.py"
      - ".github/workflows/train-native-generator.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies (not browser runtime)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train tiny causal model and export INT8 weights
        run: python lab/train_generator.py
      - name: Publish trained static weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/generator-model.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tiny Native Generator trained weights"
            git push
          fi
